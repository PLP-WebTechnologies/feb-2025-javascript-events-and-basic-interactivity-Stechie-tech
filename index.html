<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Playground</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>JavaScript Playground</h1>
            <button id="themeToggle" class="theme-toggle">
                🌙
            </button>
        </header>

        <!-- Tabs -->
        <div class="tabs">
            <div class="tab-buttons">
                <button class="tab-btn active" data-tab="0">Event Handling</button>
                <button class="tab-btn" data-tab="1">Interactive Elements</button>
                <button class="tab-btn" data-tab="2">Form Validation</button>
            </div>
            <div class="tab-content active" data-content="0">
                <p>Explore different event handlers!</p>
            </div>
            <div class="tab-content" data-content="1">
                <p>Check out these interactive components!</p>
            </div>
            <div class="tab-content" data-content="2">
                <p>Try our real-time form validation!</p>
            </div>
        </div>

        <!-- Image Gallery -->
        <div class="gallery">
            <button class="gallery-btn prev">←</button>
            <button class="gallery-btn next">→</button>
            <div class="gallery-container">
                <img src="https://images.pexels.com/photos/3536424/pexels-photo-3536424.jpeg" alt="Gallery image 1">
                <img src="https://images.pexels.com/photos/2662116/pexels-photo-2662116.jpeg" alt="Gallery image 2">
                <img src="https://images.pexels.com/photos/1366919/pexels-photo-1366919.jpeg" alt="Gallery image 3">
            </div>
        </div>

        <!-- Form -->
        <div class="form-container">
            <h2>Registration Form</h2>
            <form id="registrationForm">
                <div class="form-group">
                    <input type="text" name="username" placeholder="Username">
                    <span class="error" data-error="username"></span>
                </div>
                <div class="form-group">
                    <input type="email" name="email" placeholder="Email">
                    <span class="error" data-error="email"></span>
                </div>
                <div class="form-group">
                    <input type="password" name="password" placeholder="Password">
                    <span class="error" data-error="password"></span>
                </div>
                <button type="submit">Register</button>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
